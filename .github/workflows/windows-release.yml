# Builds the Windows x64 installer (MSI) and portable zip with packaging/windows/package.ps1
# and attaches both to a GitHub Release. Run it from the Actions tab (workflow_dispatch), or
# push a tag like v0.6.1. Binaries are unsigned unless signing secrets are configured.
name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc -vV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-release-

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build installer
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/release -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -Append -FilePath dist/release/SHA256SUMS.txt
          }

      - uses: actions/upload-artifact@v4
        with:
          name: takumi-anything-windows-x64
          path: dist/release/*
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $null
          $inPkg = $false
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\s*\[') { $inPkg = ($line.Trim() -eq '[workspace.package]'); continue }
            if ($inPkg -and $line -match '^\s*version\s*=\s*"([^"]+)"') { $version = $Matches[1]; break }
          }
          $tag = "v$version"
          @"
          Takumi Anything $version for Windows (x64).

          **Prototype, provided AS IS, with no warranty.** An independent, unofficial fork of Craft Anything. It is not made or endorsed by the ArtCraft team. Use it only on software you own or are allowed to examine.

          - ``takumi-anything-$version-windows-x64.msi``: installer.
          - ``takumi-anything-$version-windows-x64-portable.zip``: portable build; settings are kept next to the program.
          - ``SHA256SUMS.txt``: checksums.

          These files are built on GitHub Actions from the source in this repository and are not code-signed, so Windows SmartScreen may show a warning.
          "@ | ForEach-Object { $_ -replace '(?m)^ {10}', '' } | Set-Content -Path notes.md -Encoding utf8
          $exists = $true
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { $exists = $false }
          if ($exists) {
            gh release upload $tag (Get-ChildItem dist/release -File).FullName --clobber
          } else {
            gh release create $tag (Get-ChildItem dist/release -File).FullName --target $env:GITHUB_SHA --title "Takumi Anything $version" --notes-file notes.md --prerelease
          }
