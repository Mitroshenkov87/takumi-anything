<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Takumi Anything app icon: a trowel laying a brick wall. A London-pattern trowel spreading
       mortar on a two-course running-bond wall. Flat 2–3 tone facets,
       no gradients, no shine. -->
  <rect width="512" height="512" rx="52" fill="#1C1B19"/>

  <!-- Mortar bed; bricks sit on top so the gaps read as joints. -->
  <rect x="64" y="278" width="384" height="166" rx="6" fill="#C9C0B4"/>

  <!-- Bottom course. Each brick: body, top highlight, right shadow facet. -->
  <g id="brick-bottom-1">
    <rect x="72" y="360" width="120" height="76" rx="3" fill="#C4623A"/>
    <rect x="72" y="360" width="120" height="12" rx="3" fill="#D4784C"/>
    <rect x="180" y="372" width="12" height="64" fill="#9A452C"/>
  </g>
  <g id="brick-bottom-2">
    <rect x="200" y="360" width="120" height="76" rx="3" fill="#C4623A"/>
    <rect x="200" y="360" width="120" height="12" rx="3" fill="#D4784C"/>
    <rect x="308" y="372" width="12" height="64" fill="#9A452C"/>
  </g>
  <g id="brick-bottom-3">
    <rect x="328" y="360" width="112" height="76" rx="3" fill="#C4623A"/>
    <rect x="328" y="360" width="112" height="12" rx="3" fill="#D4784C"/>
    <rect x="428" y="372" width="12" height="64" fill="#9A452C"/>
  </g>

  <!-- Top course, running bond. -->
  <g id="brick-top-1">
    <rect x="72" y="286" width="58" height="66" rx="3" fill="#C4623A"/>
    <rect x="72" y="286" width="58" height="10" rx="3" fill="#D4784C"/>
    <rect x="118" y="296" width="12" height="56" fill="#9A452C"/>
  </g>
  <g id="brick-top-2">
    <rect x="138" y="286" width="120" height="66" rx="3" fill="#B55532"/>
    <rect x="138" y="286" width="120" height="10" rx="3" fill="#D4784C"/>
    <rect x="246" y="296" width="12" height="56" fill="#9A452C"/>
  </g>
  <g id="brick-top-3">
    <rect x="266" y="286" width="120" height="66" rx="3" fill="#C4623A"/>
    <rect x="266" y="286" width="120" height="10" rx="3" fill="#D4784C"/>
    <rect x="374" y="296" width="12" height="56" fill="#9A452C"/>
  </g>
  <g id="brick-top-4">
    <rect x="394" y="286" width="54" height="66" rx="3" fill="#C4623A"/>
    <rect x="394" y="286" width="54" height="10" rx="3" fill="#D4784C"/>
    <rect x="436" y="296" width="12" height="56" fill="#9A452C"/>
  </g>

  <!-- Cast shadow of the blade on the top course. -->
  <polygon fill="#6E2E18" points="250,300 360,348 348,352 238,312"/>

  <!-- Trowel: blade down-left onto the wall, handle up-right. -->
  <g transform="translate(274,226) rotate(-32)">
    <!-- Handle, mid wood + right shadow plane + grain. -->
    <rect x="-23" y="-242" width="46" height="176" rx="23" fill="#B17848"/>
    <rect x="0" y="-238" width="21" height="168" rx="10" fill="#8A5A32"/>
    <rect x="-13" y="-216" width="3" height="40" rx="1.5" fill="#5E3C20"/>
    <rect x="-13" y="-168" width="3" height="32" rx="1.5" fill="#5E3C20"/>
    <rect x="-8" y="-200" width="2.5" height="48" rx="1" fill="#6B4526"/>

    <!-- Steel ferrule: body, top bevel, bottom edge, two rivets. -->
    <rect x="-27" y="-84" width="54" height="30" rx="3" fill="#B0AAA0"/>
    <rect x="-27" y="-84" width="54" height="9" rx="3" fill="#EDE9E0"/>
    <rect x="-27" y="-61" width="54" height="7" fill="#8A847C"/>
    <circle cx="-11" cy="-68" r="4.5" fill="#5E5A54"/>
    <circle cx="-11" cy="-68" r="2" fill="#D8D3C8"/>
    <circle cx="11" cy="-68" r="4.5" fill="#5E5A54"/>
    <circle cx="11" cy="-68" r="2" fill="#D8D3C8"/>

    <!-- Tang with a left highlight facet. -->
    <rect x="-15" y="-58" width="30" height="54" fill="#D8D3C8"/>
    <rect x="-15" y="-58" width="8" height="54" fill="#EDE9E0"/>

    <!-- Blade: main, highlight facet, cutting-edge shadow, heel shade. -->
    <polygon fill="#D8D3C8" points="0,230 -92,18 -76,-16 76,-16 92,18"/>
    <polygon fill="#EDE9E0" points="-76,-16 -92,18 -36,100 8,-16"/>
    <polygon fill="#8A847C" points="0,230 92,18 80,14 0,200"/>
    <polygon fill="#B0AAA0" points="-76,-16 76,-16 68,2 -68,2"/>

    <!-- Mortar smear on the tip. -->
    <polygon fill="#C4623A" points="0,230 -26,188 20,196"/>
    <polygon fill="#9A452C" points="0,230 -26,188 -4,202"/>
  </g>
</svg>
